name: Run Single Android Container

on:
  workflow_dispatch:

jobs:
  android-runner:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Enable KVM
        run: |
          echo "Checking KVM support..."
          sudo ls -l /dev/kvm
          sudo usermod -aG kvm $USER

      - name: Start Redroid Container
        run: |
          docker run -d --rm --privileged \
            --name redroid-1 \
            -p 5555:5555 \
            redroid/redroid:11.0.0-latest \
            androidboot.hardware=mt6833 ro.secure=0 ro.debuggable=1
        
      - name: Install ADB and Verify
        run: |
          sudo apt-get update && sudo apt-get install -y android-tools-adb
          docker ps
          adb connect localhost:5555
          adb devices

      - name: Open Dailymotion
        run: |
          adb shell am start -a android.intent.action.VIEW -d "https://www.dailymotion.com"

      - name: Expose ADB Port via Bore Tunnel
        run: |
          # Bore tünelleme aracını indir ve arka planda çalıştır (5555 portunu dışarı açar)
          curl -sLO https://github.com/ekzhang/bore/releases/download/v0.5.1/bore-v0.5.1-x86_64-unknown-linux-musl.tar.gz
          tar -xzf bore-v0.5.1-x86_64-unknown-linux-musl.tar.gz
          chmod +x bore
          
          echo "=========================================="
          echo "TÜNEL BAŞLATILIYOR - LÜTFEN AŞAĞIDAKİ PORTU NOT EDİN:"
          echo "=========================================="
          ./bore local 5555 --to bore.pub &
          
          # İş akışının kapanmaması ve sizin bağlanabilmeniz için 15 dakika bekletiyoruz
          sleep 900
